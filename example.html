<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Brightspace iframe probe</title>
<style>
  html, body { height: 100%; margin: 0; padding: 0; overflow: hidden; }
  .frame-wrap { position: fixed; top: 0; left: 0; right: 0; bottom: 0; }
  iframe { width: 100%; height: 100%; border: 0; display: block; background: #0a0e14; }
</style>
</head>
<body>
<div class="frame-wrap">
<iframe srcdoc='<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<style>
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: #0a0e14;
    background-image:
      linear-gradient(rgba(250, 204, 21, 0.05) 1px, transparent 1px),
      linear-gradient(90deg, rgba(250, 204, 21, 0.05) 1px, transparent 1px);
    background-size: 24px 24px;
    color: #e6edf3;
    font-family: ui-monospace, "SF Mono", "Cascadia Code", "Roboto Mono", Menlo, Consolas, monospace;
    padding: 40px;
    overflow-y: auto;
    overflow-x: hidden;
    line-height: 1.5;
  }

  /* Boundary markers - functional, not decorative */
  .marker { position: fixed; background: #facc15; pointer-events: none; z-index: 999; }
  .m-top { top: 0; left: 0; right: 0; height: 4px; }
  .m-bot { bottom: 0; left: 0; right: 0; height: 4px; }
  .m-lft { left: 0; top: 0; bottom: 0; width: 4px; }
  .m-rgt { right: 0; top: 0; bottom: 0; width: 4px; }

  .corner {
    position: fixed; background: #ef4444; color: #fff;
    padding: 5px 9px; font-size: 11px; font-weight: 700;
    letter-spacing: 0.05em; z-index: 1000;
  }
  .c-tl { top: 14px; left: 14px; }
  .c-tr { top: 14px; right: 14px; }
  .c-bl { bottom: 14px; left: 14px; }
  .c-br { bottom: 14px; right: 14px; }

  .panel { max-width: 680px; }

  .header {
    display: flex; align-items: center; gap: 12px;
    border-bottom: 1px solid #1f2937;
    padding-bottom: 14px; margin-bottom: 28px;
  }
  .dot {
    width: 9px; height: 9px; border-radius: 50%;
    background: #4ade80; box-shadow: 0 0 10px #4ade80;
    animation: pulse 1.4s ease-in-out infinite;
  }
  @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.35; } }

  .title { font-size: 12px; letter-spacing: 0.18em; color: #8b95a3; text-transform: uppercase; }
  .status { font-size: 12px; color: #4ade80; margin-left: auto; letter-spacing: 0.1em; }

  h1 { font-size: 26px; margin: 0 0 8px 0; font-weight: 600; letter-spacing: -0.02em; }
  .sub { color: #8b95a3; margin: 0 0 28px 0; font-size: 13px; }

  .readout {
    border: 1px solid #1f2937;
    background: rgba(0, 0, 0, 0.35);
    padding: 4px 22px;
    font-size: 13px;
    margin-bottom: 28px;
  }
  .row { display: flex; justify-content: space-between; padding: 10px 0; gap: 24px; }
  .row + .row { border-top: 1px dashed #1f2937; }
  .row span { color: #8b95a3; }
  .row b { color: #facc15; font-weight: 600; font-variant-numeric: tabular-nums; }
  .row b.good { color: #4ade80; }
  .row b.warn { color: #fb923c; }

  .check {
    border-left: 2px solid #facc15;
    padding-left: 18px;
    margin-bottom: 28px;
  }
  .check-title {
    font-size: 11px; letter-spacing: 0.18em;
    text-transform: uppercase; color: #8b95a3; margin-bottom: 12px;
  }
  .check ul { margin: 0; padding-left: 20px; line-height: 1.9; font-size: 13px; }
  .check li { color: #c9d1d9; }

  .footnote {
    font-size: 12px;
    color: #6b7280;
    line-height: 1.7;
    border-top: 1px solid #1f2937;
    padding-top: 16px;
  }
  .footnote code { color: #facc15; background: rgba(250, 204, 21, 0.08); padding: 1px 5px; border-radius: 2px; font-size: 11px; }
</style>
</head>
<body>

<div class="marker m-top"></div>
<div class="marker m-bot"></div>
<div class="marker m-lft"></div>
<div class="marker m-rgt"></div>

<div class="corner c-tl">TL</div>
<div class="corner c-tr">TR</div>
<div class="corner c-bl">BL</div>
<div class="corner c-br">BR</div>

<div class="panel">
  <div class="header">
    <div class="dot"></div>
    <div class="title">brightspace iframe probe</div>
    <div class="status">ONLINE</div>
  </div>

  <h1>iframe rendering ok</h1>
  <p class="sub">Gele randen markeren de iframe-grenzen. Rode hoeken (TL/TR/BL/BR) bevestigen of alle vier hoeken zichtbaar zijn.</p>

  <div class="readout">
    <div class="row"><span>iframe.innerWidth</span><b id="iw">—</b></div>
    <div class="row"><span>iframe.innerHeight</span><b id="ih">—</b></div>
    <div class="row"><span>parent.innerWidth</span><b id="ow">—</b></div>
    <div class="row"><span>parent.innerHeight</span><b id="oh">—</b></div>
    <div class="row"><span>fill ratio (h/h)</span><b id="ratio">—</b></div>
    <div class="row"><span>devicePixelRatio</span><b id="dpr">—</b></div>
    <div class="row"><span>updated</span><b id="ts">—</b></div>
  </div>

  <div class="check">
    <div class="check-title">visuele controle</div>
    <ul>
      <li>Alle 4 gele randen volledig zichtbaar (geen onderbrekingen)?</li>
      <li>Alle 4 rode hoek-labels zichtbaar (TL, TR, BL, BR)?</li>
      <li>Fill ratio dicht bij 100%?</li>
      <li>Geen dubbele scrollbars?</li>
      <li>Het stippelraster vult het hele iframe?</li>
    </ul>
  </div>

  <div class="footnote">
    De parent dimensies komen van de wrapper-pagina (jouw HTML topic), niet van het volledige browservenster — Brightspace draait die topic zelf ook in een iframe waardoor we het echte browserformaat niet kunnen meten via JS. De ruimte die overblijft buiten de wrapper is Brightspace chrome (course nav, breadcrumb, header). Als <code>fill ratio</code> rond 100% zit en de markers zichtbaar zijn: <code>position: fixed; inset: 0</code> doet zijn werk.
  </div>
</div>

<script>
  function update() {
    var iw = window.innerWidth, ih = window.innerHeight;
    document.getElementById("iw").textContent = iw + " px";
    document.getElementById("ih").textContent = ih + " px";
    document.getElementById("dpr").textContent = window.devicePixelRatio;
    document.getElementById("ts").textContent = new Date().toLocaleTimeString();

    try {
      var ow = window.parent.innerWidth;
      var oh = window.parent.innerHeight;
      document.getElementById("ow").textContent = ow + " px";
      document.getElementById("oh").textContent = oh + " px";
      var r = ((ih / oh) * 100);
      var ratioEl = document.getElementById("ratio");
      ratioEl.textContent = r.toFixed(1) + " %";
      ratioEl.className = r >= 95 ? "good" : (r >= 80 ? "" : "warn");
    } catch (e) {
      document.getElementById("ow").textContent = "n/a (cross-origin)";
      document.getElementById("oh").textContent = "n/a (cross-origin)";
      document.getElementById("ratio").textContent = "n/a";
    }
  }
  update();
  window.addEventListener("resize", update);
  setInterval(update, 1000);
</script>

</body>
</html>'></iframe>
</div>
</body>
</html>
